<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control Box</title>

    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- SweetAlert2 for Premium Popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Dashboard Wrapper */
        .admin-dashboard {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .admin-dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* Control Box (Left Side) */
        .control-box {
            padding-right: 15px;
        }
        .header {
            margin-bottom: 25px;
        }
        .header h2 {
            font-size: 24px;
            color: #fca311;
            font-weight: 600;
        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 13px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .form-group input, 
        .form-group select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }
        .form-group input:focus, 
        .form-group select:focus {
            border-color: #fca311;
            box-shadow: 0 0 12px rgba(252, 163, 17, 0.2);
        }
        .form-group select option {
            background: #16213e;
            color: #fff;
        }

        /* File Upload Inputs */
        input[type="file"] {
            padding: 8px;
        }
        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-right: 10px;
            transition: 0.3s;
        }
        input[type="file"]::file-selector-button:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit {
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            color: white;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }
        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Preview Box (Right Side) */
        .preview-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .preview-title {
            font-size: 16px;
            color: #cbd5e1;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .preview-item {
            text-align: center;
        }
        .preview-item label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .preview-img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            border: 1px dashed rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
        }
        .preview-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: none; /* Hidden until image is selected */
        }

    </style>
</head>
<body>

    <div class="admin-dashboard">
        
        <!-- Left: Control Box -->
        <div class="control-box">
            <div class="header">
                <h2>Admin Control Center</h2>
                <p>Manage courses, batches & upload assets seamlessly.</p>
            </div>

            <form id="masterAdminForm">
                
                <div class="form-grid">
                    <!-- Text Input -->
                    <div class="form-group full-width">
                        <label>Content / Subject Title</label>
                        <input type="text" id="titleInput" placeholder="e.g. DBMS Unit 1 Notes" required>
                    </div>

                    <!-- Dropdown -->
                    <div class="form-group">
                        <label>JUT Batch</label>
                        <select id="batchSelect" required>
                            <option value="">Select Batch</option>
                            <option value="2023-26">2023-26 Session</option>
                            <option value="2024-27">2024-27 Session</option>
                            <option value="2025-28">2025-28 Session</option>
                            <option value="Placement">Placement Alert</option>
                        </select>
                    </div>
                    
                    <!-- Content Type Dropdown -->
                    <div class="form-group">
                        <label>Content Type</label>
                        <select id="typeSelect" required>
                            <option value="Notes">Study Notes</option>
                            <option value="PYQ">PYQ Solutions</option>
                            <option value="Notice">Official Notice</option>
                        </select>
                    </div>
                </div>

                <!-- File Uploads -->
                <div class="form-group">
                    <label>Upload Banner Image</label>
                    <input type="file" id="bannerUpload" accept="image/*" onchange="previewImage(event, 'bannerPreview')" required>
                </div>

                <div class="form-grid" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>Upload Photo</label>
                        <input type="file" id="photoUpload" accept="image/*" onchange="previewImage(event, 'photoPreview')">
                    </div>
                    <div class="form-group">
                        <label>Upload Signature</label>
                        <input type="file" id="signUpload" accept="image/*" onchange="previewImage(event, 'signPreview')">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="btn-group">
                    <button type="button" class="btn btn-reset" onclick="resetForm()">Reset Fields</button>
                    <button type="submit" class="btn btn-submit">Update Content</button>
                </div>
            </form>
        </div>

        <!-- Right: Live Preview Box -->
        <div class="preview-box">
            <div class="preview-title">Live Image Preview</div>
            
            <div class="preview-item">
                <label>Banner</label>
                <div class="preview-img" id="bannerPlaceholder">No Banner selected
                    <img id="bannerPreview" src="" alt="Banner">
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="preview-item" style="flex: 1;">
                    <label>Photo</label>
                    <div class="preview-img" style="height: 80px;" id="photoPlaceholder">Empty
                        <img id="photoPreview" src="" alt="Photo">
                    </div>
                </div>
                <div class="preview-item" style="flex: 1;">
                    <label>Signature</label>
                    <div class="preview-img" style="height: 80px;" id="signPlaceholder">Empty
                        <img id="signPreview" src="" alt="Sign">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Image Live Preview Logic
        function previewImage(event, previewId) {
            const input = event.target;
            const previewImg = document.getElementById(previewId);
            const placeholderText = previewImg.parentElement;

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block'; // Show image
                    // Hide placeholder text by setting color transparent
                    placeholderText.style.color = 'transparent'; 
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Form Reset Logic
        function resetForm() {
            document.getElementById('masterAdminForm').reset();
            // Reset previews
            const previews = ['bannerPreview', 'photoPreview', 'signPreview'];
            previews.forEach(id => {
                const img = document.getElementById(id);
                img.src = '';
                img.style.display = 'none';
                img.parentElement.style.color = '#64748b'; // Restore placeholder text
            });
        }

        // Form Submit & SweetAlert2 Logic
        document.getElementById('masterAdminForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('titleInput').value;
            const batch = document.getElementById('batchSelect').value;

            // Loading Animation
            Swal.fire({
                title: 'Uploading...',
                html: 'Saving images and updating database.',
                timerProgressBar: true,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            // Fake Backend Delay
            setTimeout(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Update Successful!',
                    html: `<b>${title}</b> has been published for Batch <b>${batch}</b>.`,
                    background: '#16213e',
                    color: '#fff',
                    confirmButtonColor: '#3b82f6',
                    confirmButtonText: 'Done'
                });
                resetForm();
            }, 1800);
        });
    </script>
</body>
</html>
